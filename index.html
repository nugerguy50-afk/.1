<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blox Fruits Image Library</title>
<style>body{font:16px system-ui,sans-serif;background:#101114;color:#eee;margin:0;padding:24px}h1{margin:0 0 8px}p{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;margin-top:24px}.card{background:#1c1e23;border:1px solid #30333a;border-radius:12px;padding:12px;text-align:center}.card img{width:100%;height:115px;object-fit:contain}.card a{display:block;color:#a9e96b;overflow-wrap:anywhere;font-size:13px;margin-top:6px}code{color:#a9e96b}</style></head><body><h1>Blox Fruits Image Library</h1><p>Static fruit image hosting for the Zombie Fruit Finder. Image files are in <code>/images/</code>; the JSON list is <a href="manifest.json">manifest.json</a>.</p><div id="grid" class="grid">Loading images…</div><script>fetch('./manifest.json').then(r=>r.json()).then(data=>{const grid=document.getElementById('grid');grid.textContent='';for(const file of data.images||[]){const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.loading='lazy';img.src='./images/'+encodeURIComponent(file);img.alt=file;const label=document.createElement('div');label.textContent=file;const link=document.createElement('a');link.href='./images/'+encodeURIComponent(file);link.textContent='Open image';link.target='_blank';card.append(img,label,link);grid.append(card)}}).catch(()=>document.getElementById('grid').textContent='Could not load manifest.json');</script></body></html>
